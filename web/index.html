<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Catch - タスク・予定・ウォッチ・天気をまとめて管理">
  <meta name="theme-color" content="#5B63D3">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Catch">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Catch</title>

  <!-- Browser OCR for the free iPhone/PWA build. -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    window.catchRecognizeImage = async function (dataUrl) {
      if (!window.Tesseract) {
        throw new Error('Web OCRの読み込みに失敗しました');
      }
      const result = await Tesseract.recognize(dataUrl, 'jpn+eng', {
        logger: function (m) {
          if (m && m.status) console.log('[Catch OCR]', m.status, m.progress || '');
        }
      });
      return (result && result.data && result.data.text) ? result.data.text : '';
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
