name: Build Catch App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Catch-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iPhone unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare iOS project
        run: |
          chmod +x setup_ios.command
          ./setup_ios.command

      - name: Build iPhone app without signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/unsigned_ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned_ipa/Payload/
          cd build/unsigned_ipa
          /usr/bin/zip -r Catch-unsigned.ipa Payload

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: Catch-iPhone-Unsigned
          path: build/unsigned_ipa/Catch-unsigned.ipa
